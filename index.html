<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魔法师 vs 史莱姆军团 - 技能觉醒与宠物版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #12151f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 顶部状态栏 */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .xp-bar-container {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.15s ease-out;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }
    .badge {
      background: rgba(20, 25, 38, 0.78);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(4px);
    }
    #skills-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .skill-tag {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(129, 140, 248, 0.45);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #e0e7ff;
    }
    #sound-btn {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(20, 25, 38, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    #sound-btn:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* 弹窗遮罩 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 13, 22, 0.84);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: clamp(26px, 5vw, 42px);
      margin-bottom: 10px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 460px;
      line-height: 1.6;
      font-size: 15px;
    }
    .primary-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.55);
    }

    /* 升级三选一卡牌 */
    .cards-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 780px;
      margin-top: 14px;
    }
    .upgrade-card {
      background: linear-gradient(180deg, #1e2538 0%, #151a28 100%);
      border: 2px solid rgba(129, 140, 248, 0.35);
      border-radius: 16px;
      padding: 18px 14px;
      width: 215px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .upgrade-card.new-skill {
      border-color: rgba(250, 204, 21, 0.6);
      background: linear-gradient(180deg, #27233a 0%, #171826 100%);
    }
    .upgrade-card:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
    }
    .card-badge {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
    }
    .new-skill .card-badge {
      background: rgba(250, 204, 21, 0.25);
      color: #fde047;
    }
    .card-icon {
      font-size: 36px;
    }
    .card-title {
      font-size: 17px;
      font-weight: bold;
      color: #f8fafc;
    }
    .card-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <div class="xp-bar-container">
      <div id="xp-fill"></div>
    </div>
    <div class="stats-row">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span class="badge" id="level-text">Lv.1</span>
        <span class="badge" id="time-text">00:00</span>
        <span class="badge" id="kill-text">击杀: 0</span>
        <div id="skills-bar"></div>
      </div>
      <button id="sound-btn">🔊 音效: 开</button>
    </div>
  </div>

  <!-- 开始界面 -->
  <div id="start-screen" class="overlay">
    <h1>🧙‍♂️ 魔法师 vs 史莱姆军团</h1>
    <p class="subtitle">
      <b>WASD / 方向键</b>（或拖动屏幕虚拟摇杆）移动。<br>
      升级可解锁<b>🔥火焰法典</b>、<b>⚡雷暴法阵</b>、<b>❄️冰霜新星</b>及<b>🐺暗夜小灰狼宠物</b>！<br>
      <span style="color: #38bdf8;">提示：按下【空格键 Space】可瞬间将宠物召回身边护主！</span>
    </p>
    <button class="primary-btn" id="start-btn">开始战斗</button>
  </div>

  <!-- 升级界面 -->
  <div id="levelup-screen" class="overlay hidden">
    <h1>✨ 魔力觉醒！选择一项强化</h1>
    <div class="cards-container" id="cards-box"></div>
  </div>

  <!-- 结束界面 -->
  <div id="gameover-screen" class="overlay hidden">
    <h1>💀 魔力耗尽</h1>
    <p class="subtitle" id="final-stats">存活时间: 00:00 | 击杀史莱姆: 0</p>
    <button class="primary-btn" id="restart-btn">再来一局</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================================
    // 🐾 1. 宠物核心类（定义在脚本最顶端，挂载到 window）
    // ==========================================
    class Pet {
      constructor(type, name) {
        this.type = type;           
        this.name = name;           
        this.maxHp = 120;
        this.hp = 120;
        this.attack = 15;
        this.attackRange = 40;      
        this.speed = 3.0;           
        this.isDead = false;
        this.respawnTimer = 0;      
        this.x = 0;
        this.y = 0;
        this.invulnTimer = 0;
      }

      update(player, enemies) {
        if (this.invulnTimer > 0) {
          this.invulnTimer -= 1 / 60; // 🌟 新增：无敌时间递减
        }
        if (this.isDead) {
          if (this.respawnTimer > 0) {
            this.respawnTimer -= 1 / 60; 
          } else {
            this.revive(player);
          }
          return;
        }

        let target = this.findNearestEnemy(enemies);
        if (target) {
          let dx = target.x - this.x;
          let dy = target.y - this.y;
          let dist = Math.hypot(dx, dy);

          if (dist > this.attackRange) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
          } else {
            this.attackTarget(target);
          }
        } else {
          let dx = player.x - this.x;
          let dy = player.y - this.y;
          let dist = Math.hypot(dx, dy);

          if (dist > 80) {
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;
          }
        }
      }

      findNearestEnemy(enemies) {
        let nearest = null;
        let minDist = Infinity;
        for (let enemy of enemies) {
          let dist = Math.hypot(enemy.x - this.x, enemy.y - this.y);
          if (dist < minDist) {
            minDist = dist;
            nearest = enemy;
          }
        }
        return nearest;
      }

     attackTarget(target) {
        target.hp -= this.attack;
        target.hitFlash = 0.08;
        spawnParticles(this.x, this.y, '#f97316', 3);
        // 🌟 吸血机制：每次攻击命中敌人，小灰狼回复 3 点血！
        this.hp = Math.min(this.maxHp, this.hp + 3);
      }

      takeDamage(amount) {
        if (this.isDead || this.invulnTimer > 0) return;
        this.hp -= amount;
        this.invulnTimer = 0.45;
        if (this.hp <= 0) {
          this.die();
        }
      }

      die() {
        this.isDead = true;
        this.respawnTimer = 60; 
        this.maxHp = 50;
        this.hp = 0;
        this.attack = 10;
        console.log(`${this.name} 阵亡！培养属性已清零，60秒后复活。`);
      }

      revive(player) {
        this.isDead = false;
        this.hp = this.maxHp;
        this.x = player.x + 20;
        this.y = player.y + 20;
        console.log(`${this.name} 已经复活！`);
      }

      recall(player) {
        if (this.isDead) return;
        this.x = player.x; // 直接和玩家 X 坐标重叠
        this.y = player.y; // 直接和玩家 Y 坐标重叠
      }
    }

    window.Pet = Pet;
    let activePet = null;

    // ==========================================
    // 🎮 2. 游戏基础变量与配置
    // ==========================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const xpFill = document.getElementById('xp-fill');
    const levelText = document.getElementById('level-text');
    const timeText = document.getElementById('time-text');
    const killText = document.getElementById('kill-text');
    const skillsBar = document.getElementById('skills-bar');
    const soundBtn = document.getElementById('sound-btn');

    const startScreen = document.getElementById('start-screen');
    const levelupScreen = document.getElementById('levelup-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const cardsBox = document.getElementById('cards-box');
    const finalStats = document.getElementById('final-stats');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 合成音效系统
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'thunder') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'frost') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(920, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.25);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'gem') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.07);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.08);
        osc.frequency.setValueAtTime(659, now + 0.16);
        osc.frequency.setValueAtTime(880, now + 0.24);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 音效: 开' : '🔇 音效: 关';
    });

    let gameState = 'START';
    let lastTime = 0;
    let elapsedTime = 0;
    let kills = 0;
    let spawnTimer = 0;

    let player = {};
    let bullets = [];
    let enemies = [];
    let gems = [];
    let particles = [];
    let lightnings = [];
    let frostWaves = [];

    // 输入控制
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (e.code === 'Space' && activePet) {
        activePet.recall(player);
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let joystick = { active: false, startX: 0, startY: 0, currX: 0, currY: 0, dx: 0, dy: 0 };
    canvas.addEventListener('pointerdown', e => {
      if (gameState !== 'PLAYING') return;
      joystick.active = true;
      joystick.startX = e.clientX;
      joystick.startY = e.clientY;
      joystick.currX = e.clientX;
      joystick.currY = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!joystick.active) return;
      joystick.currX = e.clientX;
      joystick.currY = e.clientY;
      const distX = joystick.currX - joystick.startX;
      const distY = joystick.currY - joystick.startY;
      const dist = Math.hypot(distX, distY);
      const maxDist = 50;
      if (dist > 5) {
        joystick.dx = (distX / dist) * Math.min(dist / maxDist, 1);
        joystick.dy = (distY / dist) * Math.min(dist / maxDist, 1);
      } else {
        joystick.dx = 0;
        joystick.dy = 0;
      }
    });
    window.addEventListener('pointerup', () => {
      joystick.active = false;
      joystick.dx = 0;
      joystick.dy = 0;
    });

    // 动态生成升级卡牌池
    function getAvailableUpgrades() {
      const pool = [
        {
          isSkill: true,
          badge: `奥术飞弹 Lv.${player.skills.missile + 1}`,
          icon: '🔮',
          title: '多重奥术飞弹',
          desc: '每次发射的飞弹数量 +1，伤害 +15%',
          apply: () => {
            player.skills.missile++;
            player.projectileCount += 1;
            player.damage = Math.round(player.damage * 1.15);
          }
        },
        {
          isSkill: true,
          badge: player.skills.fireOrb === 0 ? '✨ 解锁新魔法' : `火焰法典 Lv.${player.skills.fireOrb + 1}`,
          icon: '🔥',
          title: player.skills.fireOrb === 0 ? '火焰法典' : '火焰法典·强化',
          desc: player.skills.fireOrb === 0
            ? '召唤 2 颗火球环绕身体旋转，灼烧并击退靠近的敌人'
            : '环绕火球数量 +1，旋转速度与灼烧伤害提升',
          apply: () => {
            if (player.skills.fireOrb === 0) {
              player.skills.fireOrb = 1;
              player.fireOrbCount = 2;
            } else {
              player.skills.fireOrb++;
              player.fireOrbCount += 1;
              player.fireOrbSpeed += 0.45;
              player.fireOrbDamage = Math.round(player.fireOrbDamage * 1.25);
            }
          }
        },
        {
          isSkill: true,
          badge: player.skills.thunder === 0 ? '✨ 解锁新魔法' : `雷暴法阵 Lv.${player.skills.thunder + 1}`,
          icon: '⚡',
          title: player.skills.thunder === 0 ? '雷暴法阵' : '雷暴法阵·强化',
          desc: player.skills.thunder === 0
            ? '每 2.4 秒召唤天雷轰击随机敌人，造成范围高额伤害'
            : '天雷劈落数量 +1，冷却缩短，雷电伤害提升',
          apply: () => {
            if (player.skills.thunder === 0) {
              player.skills.thunder = 1;
            } else {
              player.skills.thunder++;
              player.thunderCount += 1;
              player.thunderCooldown = Math.max(0.9, player.thunderCooldown * 0.85);
              player.thunderDamage = Math.round(player.thunderDamage * 1.25);
            }
          }
        },
        {
          isSkill: true,
          badge: player.skills.frost === 0 ? '✨ 解锁新魔法' : `冰霜新星 Lv.${player.skills.frost + 1}`,
          icon: '❄️',
          title: player.skills.frost === 0 ? '冰霜新星' : '冰霜新星·强化',
          desc: player.skills.frost === 0
            ? '每隔数秒释放寒冰冲击波，冻结周围敌人使其减速 60%'
            : '寒冰冲击波范围扩大 25%，冷却时间缩短',
          apply: () => {
            if (player.skills.frost === 0) {
              player.skills.frost = 1;
            } else {
              player.skills.frost++;
              player.frostRadius = Math.round(player.frostRadius * 1.25);
              player.frostCooldown = Math.max(1.8, player.frostCooldown * 0.85);
              player.frostDamage = Math.round(player.frostDamage * 1.3);
            }
          }
        },
        {
          isSkill: false,
          badge: '通用强化',
          icon: '⚡',
          title: '急速施法',
          desc: '所有魔法的冷却时间减少 15%',
          apply: () => {
            player.fireCooldown *= 0.85;
            player.thunderCooldown *= 0.85;
            player.frostCooldown *= 0.85;
          }
        },
        {
          isSkill: false,
          badge: '通用强化',
          icon: '👟',
          title: '疾风步',
          desc: '移动速度 +15%, 经验拾取范围 +30%',
          apply: () => {
            player.speed *= 1.15;
            player.pickupRadius *= 1.3;
          }
        },
        {
          isSkill: false,
          badge: '生存强化',
          icon: '❤️',
          title: '生命涌泉',
          desc: '最大生命 +30 并立即恢复 50% 生命值',
          apply: () => {
            player.maxHp += 30;
            player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
          }
        },
        {
          isSkill: true,
          badge: !activePet ? '✨ 解锁宠物' : `🐺 灰狼强化 Lv.${(activePet.level || 1) + 1}`,
          icon: '🐺',
          title: !activePet ? '暗夜小灰狼' : '暗夜小灰狼·晋升',
          desc: !activePet 
            ? '召唤一只极速撕咬的近战暗夜灰狼。阵亡后需 60 秒复活且属性清零。'
            : '小灰狼吞噬魔力进化：攻击力 +6，最大生命 +30 并瞬间回满血！',
          apply: () => {
            if (!activePet) {
              // 第一次获得：初始化宠物，并记录等级为 1
              activePet = new Pet('wolf', '暗夜小灰狼');
              activePet.level = 1;
              activePet.x = player.x + 20;
              activePet.y = player.y + 20;
              console.log("成功召唤：暗夜小灰狼 Lv.1！");
            } else {
              // 已经拥有：提升等级，增加攻击和血量上限，并回满当前血量
              activePet.level = (activePet.level || 1) + 1;
              activePet.attack += 6;
              activePet.maxHp += 30;
              activePet.hp = activePet.maxHp; // 升级瞬间回满血！
              console.log(`小灰狼升级至 Lv.${activePet.level}！当前攻击：${activePet.attack}，最大生命：${activePet.maxHp}`);
            }
          }
        }
      ];
      return pool;
    }

    function initGame() {
      activePet = null;

      player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 16,
        speed: 215,
        hp: 150,
        maxHp: 150,
        level: 1,
        xp: 0,
        nextXp: 8,
        pickupRadius: 80,
        invulnTimer: 0,

        skills: {
          missile: 1,
          fireOrb: 0,
          thunder: 0,
          frost: 0
        },

        fireCooldown: 0.45,
        fireTimer: 0,
        damage: 13,
        projectileCount: 1,
        projectileSpeed: 470,

        fireOrbCount: 0,
        fireOrbAngle: 0,
        fireOrbRadius: 72,
        fireOrbSpeed: 2.8,
        fireOrbDamage: 16,

        thunderCooldown: 1.8,
        thunderTimer: 0.5,
        thunderCount: 1,
        thunderDamage: 38,

        frostCooldown: 4.0,
        frostTimer: 1.0,
        frostRadius: 155,
        frostDamage: 12
      };

      bullets = [];
      enemies = [];
      gems = [];
      particles = [];
      lightnings = [];
      frostWaves = [];
      elapsedTime = 0;
      kills = 0;
      spawnTimer = 0;
      updateHUD();
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function startGame() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.log("音频初始化提示：", e);
      }

      initGame();
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      levelupScreen.classList.add('hidden');
      gameState = 'PLAYING';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function triggerLevelUp() {
      gameState = 'LEVELUP';
      playSound('levelup');
      cardsBox.innerHTML = '';

      const pool = getAvailableUpgrades();
      const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 3);

      shuffled.forEach(item => {
        const card = document.createElement('div');
        card.className = 'upgrade-card' + (item.isSkill ? ' new-skill' : '');
        card.innerHTML = `
          <span class="card-badge">${item.badge}</span>
          <div class="card-icon">${item.icon}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.desc}</div>
        `;
        card.onclick = () => {
          item.apply();
          levelupScreen.classList.add('hidden');
          updateHUD();
          gameState = 'PLAYING';
          lastTime = performance.now();
          requestAnimationFrame(gameLoop);
        };
        cardsBox.appendChild(card);
      });

      levelupScreen.classList.remove('hidden');
    }

    function spawnEnemy() {
      const margin = 40;
      let x, y;
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
      else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + margin; }
      else { x = -margin; y = Math.random() * canvas.height; }

      const difficulty = 1 + elapsedTime / 42;
      const isBig = Math.random() < Math.min(0.28, elapsedTime / 160);

      enemies.push({
        x,
        y,
        isBig: isBig,
        damageToPlayer: isBig ? 24 : 12,
        damageToPet: isBig ? 16 : 8,
        radius: isBig ? 22 : 13,
        speed: isBig ? 65 : (85 + Math.random() * 25),
        hp: Math.round((isBig ? 55 : 18) * difficulty),
        maxHp: Math.round((isBig ? 55 : 18) * difficulty),
        color: isBig ? '#f43f5e' : '#4ade80',
        xpValue: isBig ? 5 : 2,
        hitFlash: 0,
        orbHitCooldown: 0,
        slowTimer: 0
      });
    }

    function damageEnemy(e, dmg, knockbackX = 0, knockbackY = 0) {
      e.hp -= dmg;
      e.hitFlash = 0.08;
      e.x += knockbackX;
      e.y += knockbackY;
      if (e.hp <= 0 && !e.dead) {
        e.dead = true;
        playSound('hit');
        spawnParticles(e.x, e.y, e.color, 8);
        gems.push({ x: e.x, y: e.y, value: e.xpValue });
        kills++;
      }
    }

    function spawnParticles(x, y, color, count = 6) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 120;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.2,
          maxLife: 0.55,
          color,
          size: 3 + Math.random() * 3
        });
      }
    }

    function update(dt) {
      elapsedTime += dt;

      let moveX = joystick.dx;
      let moveY = joystick.dy;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      const len = Math.hypot(moveX, moveY);
      if (len > 1) {
        moveX /= len;
        moveY /= len;
      }

      player.x += moveX * player.speed * dt;
      player.y += moveY * player.speed * dt;
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius + 55, Math.min(canvas.height - player.radius, player.y));

      if (player.invulnTimer > 0) player.invulnTimer -= dt;

      // 更新宠物 AI
      if (activePet) {
        activePet.update(player, enemies);
      }

      // 技能1：奥术飞弹
      player.fireTimer -= dt;
      if (player.fireTimer <= 0 && enemies.length > 0) {
        let nearest = null;
        let minDist = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < minDist) {
            minDist = d;
            nearest = e;
          }
        }
        if (nearest) {
          const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          const spread = 0.16;
          for (let i = 0; i < player.projectileCount; i++) {
            const offset = (i - (player.projectileCount - 1) / 2) * spread;
            const angle = baseAngle + offset;
            bullets.push({
              x: player.x,
              y: player.y,
              vx: Math.cos(angle) * player.projectileSpeed,
              vy: Math.sin(angle) * player.projectileSpeed,
              radius: 6,
              damage: player.damage,
              life: 1.8
            });
          }
          playSound('shoot');
          player.fireTimer = player.fireCooldown;
        }
      }

      // 技能2：火焰法典
      if (player.skills.fireOrb > 0) {
        player.fireOrbAngle += player.fireOrbSpeed * dt;
        for (let i = 0; i < player.fireOrbCount; i++) {
          const angle = player.fireOrbAngle + (Math.PI * 2 / player.fireOrbCount) * i;
          const orbX = player.x + Math.cos(angle) * player.fireOrbRadius;
          const orbY = player.y + Math.sin(angle) * player.fireOrbRadius;

          for (const e of enemies) {
            if (e.dead || e.orbHitCooldown > 0) continue;
            if (Math.hypot(orbX - e.x, orbY - e.y) < 11 + e.radius) {
              const pushAngle = Math.atan2(e.y - player.y, e.x - player.x);
              damageEnemy(e, player.fireOrbDamage, Math.cos(pushAngle) * 14, Math.sin(pushAngle) * 14);
              e.orbHitCooldown = 0.35;
              spawnParticles(orbX, orbY, '#fb923c', 4);
            }
          }
        }
      }

      // 技能3：雷暴法阵
      if (player.skills.thunder > 0) {
        player.thunderTimer -= dt;
        if (player.thunderTimer <= 0 && enemies.length > 0) {
          player.thunderTimer = player.thunderCooldown;
          playSound('thunder');
          for (let k = 0; k < player.thunderCount; k++) {
            const target = enemies[Math.floor(Math.random() * enemies.length)];
            if (target) {
              lightnings.push({ x: target.x, y: target.y, life: 0.25, maxLife: 0.25 });
              spawnParticles(target.x, target.y, '#facc15', 10);
              for (const e of enemies) {
                if (!e.dead && Math.hypot(e.x - target.x, e.y - target.y) < 55 + e.radius) {
                  damageEnemy(e, player.thunderDamage);
                }
              }
            }
          }
        }
      }

      // 技能4：冰霜新星
      if (player.skills.frost > 0) {
        player.frostTimer -= dt;
        if (player.frostTimer <= 0) {
          player.frostTimer = player.frostCooldown;
          playSound('frost');
          frostWaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: player.frostRadius, life: 0.35 });
          for (const e of enemies) {
            if (!e.dead && Math.hypot(e.x - player.x, e.y - player.y) < player.frostRadius + e.radius) {
              e.slowTimer = 2.8;
              damageEnemy(e, player.frostDamage);
            }
          }
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }
        for (const e of enemies) {
          if (!e.dead && Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
            damageEnemy(e, b.damage);
            spawnParticles(b.x, b.y, '#60a5fa', 3);
            bullets.splice(i, 1);
            break;
          }
        }
      }

      enemies = enemies.filter(e => !e.dead);

      spawnTimer -= dt;
      const spawnInterval = Math.max(0.16, 0.9 - elapsedTime * 0.008);
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = spawnInterval;
      }

      for (const e of enemies) {
        if (e.hitFlash > 0) e.hitFlash -= dt;
        if (e.orbHitCooldown > 0) e.orbHitCooldown -= dt;
        if (e.slowTimer > 0) e.slowTimer -= dt;

        const speedFactor = e.slowTimer > 0 ? 0.4 : 1.0;

        // 🌟 1. 仇恨判定：检查小灰狼是否存活且在附近
        let targetX = player.x;
        let targetY = player.y;
        let targetRadius = player.radius;

        if (activePet && !activePet.isDead) {
          let distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
          let distToPet = Math.hypot(activePet.x - e.x, activePet.y - e.y);

          // 如果小灰狼离怪物更近（比如距离小于 120 像素），怪物就会把仇恨转移到小灰狼身上！
          if (distToPet < 120 && distToPet < distToPlayer) {
            targetX = activePet.x;
            targetY = activePet.y;
            targetRadius = 11; // 小灰狼的碰撞半径
          }
        }

        // 🌟 2. 怪物朝选中的仇恨目标（玩家或小灰狼）移动
        const angle = Math.atan2(targetY - e.y, targetX - e.x);
        e.x += Math.cos(angle) * e.speed * speedFactor * dt;
        e.y += Math.sin(angle) * e.speed * speedFactor * dt;
        
        // 判定与玩家的碰撞
        const distPlayer = Math.hypot(player.x - e.x, player.y - e.y);
        if (distPlayer < player.radius + e.radius) {
          if (player.invulnTimer <= 0) {
            player.hp -= (e.damageToPlayer || 12); // 🌟 使用差异化伤害
            player.invulnTimer = 0.45;
            spawnParticles(player.x, player.y, '#ef4444', 6);
            if (player.hp <= 0) {
              gameState = 'GAMEOVER';
              finalStats.textContent = `存活时间: ${formatTime(elapsedTime)} | 击杀史莱姆: ${kills}`;
              gameoverScreen.classList.remove('hidden');
            }
          }
        }

        // 🌟 判定与小灰狼的碰撞（受宠物自身 invulnTimer 保护，不再被瞬间围殴秒杀）
        if (activePet && !activePet.isDead) {
          const distPet = Math.hypot(activePet.x - e.x, activePet.y - e.y);
          if (distPet < 11 + e.radius) {
            if (activePet.invulnTimer <= 0) {
              activePet.takeDamage(e.damageToPet || 8); // 🌟 使用差异化伤害
              spawnParticles(activePet.x, activePet.y, '#ef4444', 3);
            }
          }
        }

        // 🌟 判定与小灰狼的碰撞（怪物攻击小灰狼！）
        if (activePet && !activePet.isDead) {
          const distPet = Math.hypot(activePet.x - e.x, activePet.y - e.y);
          if (distPet < 11 + e.radius) {
            // 给小灰狼扣血（每帧扣一点或者带冷却，这里做个简单平滑扣血）
            // 我们用 e.petHitCooldown 确保小灰狼不会被瞬间秒杀，每 0.8 秒被咬一次
            if (!e.petHitCooldown || e.petHitCooldown <= 0) {
              activePet.takeDamage(8); // 怪物每次咬小灰狼 8 点血
              e.petHitCooldown = 0.8;
              spawnParticles(activePet.x, activePet.y, '#ef4444', 3); // 小灰狼受伤掉血特效
            }
          }
        }
        if (e.petHitCooldown > 0) e.petHitCooldown -= dt;
      }

      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < player.pickupRadius) {
          const angle = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(angle) * 350 * dt;
          g.y += Math.sin(angle) * 350 * dt;
        }
        if (dist < player.radius + 8) {
          player.xp += g.value;
          gems.splice(i, 1);
          playSound('gem');

          if (player.xp >= player.nextXp) {
            player.xp -= player.nextXp;
            player.level++;
            player.nextXp = Math.round(player.nextXp * 1.18 + 4);
            updateHUD();
            triggerLevelUp();
            return;
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = lightnings.length - 1; i >= 0; i--) {
        lightnings[i].life -= dt;
        if (lightnings[i].life <= 0) lightnings.splice(i, 1);
      }
      for (let i = frostWaves.length - 1; i >= 0; i--) {
        const fw = frostWaves[i];
        fw.radius += (fw.maxRadius - fw.radius) * 12 * dt;
        fw.life -= dt;
        if (fw.life <= 0) frostWaves.splice(i, 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#12151f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 绘制网格背景
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      const offsetX = - (player.x || 0) % gridSize;
      const offsetY = - (player.y || 0) % gridSize;
      ctx.beginPath();
      for (let x = offsetX; x < canvas.width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
      }
      for (let y = offsetY; y < canvas.height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
      }
      ctx.stroke();

      // 绘制宝石
      for (const g of gems) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(g.x, g.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制子弹
      for (const b of bullets) {
        ctx.fillStyle = '#60a5fa';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制火焰法典环绕火球
      if (player.skills.fireOrb > 0) {
        for (let i = 0; i < player.fireOrbCount; i++) {
          const angle = player.fireOrbAngle + (Math.PI * 2 / player.fireOrbCount) * i;
          const orbX = player.x + Math.cos(angle) * player.fireOrbRadius;
          const orbY = player.y + Math.sin(angle) * player.fireOrbRadius;
          ctx.fillStyle = '#f97316';
          ctx.beginPath();
          ctx.arc(orbX, orbY, 11, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 绘制敌人
      for (const e of enemies) {
        // 🌟 如果正在受击闪白，显示白色；如果处于冰冻减速状态，显示冰蓝色；否则显示原本颜色
        let renderColor = e.color;
        if (e.hitFlash > 0) {
          renderColor = '#ffffff';
        } else if (e.slowTimer > 0) {
          renderColor = '#38bdf8'; // 冰霜亮蓝色！
        }

        ctx.fillStyle = renderColor;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();

        // 史莱姆眼睛
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(e.x - 4, e.y - 3, 2, 0, Math.PI * 2);
        ctx.arc(e.x + 4, e.y - 3, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制雷击特效
      for (const l of lightnings) {
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(l.x, l.y - 120);
        ctx.lineTo(l.x + (Math.random() - 0.5) * 15, l.y);
        ctx.stroke();
      }

      // 绘制冰霜冲击波
      for (const fw of frostWaves) {
        ctx.strokeStyle = `rgba(56, 189, 248, ${fw.life * 2.5})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(fw.x, fw.y, fw.radius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 绘制粒子
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // 🐾 绘制宠物（小灰狼）
      // 🐾 绘制宠物（小灰狼及血条）
      if (activePet) {
        if (activePet.isDead) {
          ctx.fillStyle = 'rgba(239, 68, 68, 0.8)';
          ctx.font = '11px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`🐺 复活中: ${Math.ceil(activePet.respawnTimer)}s`, player.x, player.y - 28);
        } else {
          // 1. 绘制小灰狼身体（无敌期间闪烁白灰色）
          ctx.fillStyle = (activePet.invulnTimer > 0 && Math.floor(Date.now() / 60) % 2 === 0) ? '#e2e8f0' : '#94a3b8';
          ctx.beginPath();
          ctx.arc(activePet.x, activePet.y, 11, 0, Math.PI * 2);
          ctx.fill();

          // 2. 绘制小灰狼名字
          ctx.fillStyle = '#f8fafc';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('🐺 小灰狼', activePet.x, activePet.y - 22);

          // 3. 🌟 绘制小灰狼专属血条
          const petBarWidth = 28;
          const petBarHeight = 4;
          // 血条背景（黑色半透明）
          ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          ctx.fillRect(activePet.x - petBarWidth / 2, activePet.y + 14, petBarWidth, petBarHeight);
          // 当前血量（绿色/黄色）
          ctx.fillStyle = '#22c55e';
          const hpPercent = Math.max(0, activePet.hp / activePet.maxHp);
          ctx.fillRect(activePet.x - petBarWidth / 2, activePet.y + 14, petBarWidth * hpPercent, petBarHeight);
        }
      }

      // 绘制玩家（魔法师）
      ctx.fillStyle = player.invulnTimer > 0 && Math.floor(Date.now() / 60) % 2 === 0 ? '#93c5fd' : '#3b82f6';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // 魔法师法帽顶饰
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath();
      ctx.arc(player.x, player.y - 6, 6, 0, Math.PI * 2);
      ctx.fill();

      // 玩家血条
      const barWidth = 36;
      const barHeight = 5;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(player.x - barWidth / 2, player.y + player.radius + 6, barWidth, barHeight);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(player.x - barWidth / 2, player.y + player.radius + 6, barWidth * (player.hp / player.maxHp), barHeight);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateHUD() {
      xpFill.style.width = `${(player.xp / player.nextXp) * 100}%`;
      levelText.textContent = `Lv.${player.level}`;
      killText.textContent = `击杀: ${kills}`;

      skillsBar.innerHTML = '';
      if (player.skills.missile > 0) {
        skillsBar.innerHTML += `<span class="skill-tag">🔮 奥术 Lv.${player.skills.missile}</span>`;
      }
      if (player.skills.fireOrb > 0) {
        skillsBar.innerHTML += `<span class="skill-tag">🔥 火焰 Lv.${player.skills.fireOrb}</span>`;
      }
      if (player.skills.thunder > 0) {
        skillsBar.innerHTML += `<span class="skill-tag">⚡ 雷暴 Lv.${player.skills.thunder}</span>`;
      }
      if (player.skills.frost > 0) {
        skillsBar.innerHTML += `<span class="skill-tag">❄️ 冰霜 Lv.${player.skills.frost}</span>`;
      }
      if (activePet) {
        const petLevel = activePet.level || 1;
        const petStatusText = activePet.isDead ? `(复活中 ${Math.ceil(activePet.respawnTimer)}s)` : `(Lv.${petLevel})`;
        skillsBar.innerHTML += `<span class="skill-tag" style="border-color: rgba(250,204,21,0.5); color: #fde047;">🐺 小灰狼 ${petStatusText}</span>`;
      }
    }

    function gameLoop(timestamp) {
      if (gameState !== 'PLAYING') return;

      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      draw();

      timeText.textContent = formatTime(elapsedTime);
      updateHUD();

      requestAnimationFrame(gameLoop);
    }
  </script>
</body>
</html>
