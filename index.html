<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魔法师 vs 史莱姆军团 - 技能觉醒版</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #12151f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 顶部状态栏 */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .xp-bar-container {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.15s ease-out;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }
    .badge {
      background: rgba(20, 25, 38, 0.78);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(4px);
    }
    #skills-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .skill-tag {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(129, 140, 248, 0.45);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #e0e7ff;
    }
    #sound-btn {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(20, 25, 38, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    #sound-btn:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* 弹窗遮罩 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 13, 22, 0.84);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: clamp(26px, 5vw, 42px);
      margin-bottom: 10px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 460px;
      line-height: 1.6;
      font-size: 15px;
    }
    .primary-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.55);
    }

    /* 升级三选一卡牌 */
    .cards-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 780px;
      margin-top: 14px;
    }
    .upgrade-card {
      background: linear-gradient(180deg, #1e2538 0%, #151a28 100%);
      border: 2px solid rgba(129, 140, 248, 0.35);
      border-radius: 16px;
      padding: 18px 14px;
      width: 215px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .upgrade-card.new-skill {
      border-color: rgba(250, 204, 21, 0.6);
      background: linear-gradient(180deg, #27233a 0%, #171826 100%);
    }
    .upgrade-card:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
    }
    .card-badge {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
    }
    .new-skill .card-badge {
      background: rgba(250, 204, 21, 0.25);
      color: #fde047;
    }
    .card-icon {
      font-size: 36px;
    }
    .card-title {
      font-size: 17px;
      font-weight: bold;
      color: #f8fafc;
    }
    .card-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <div class="xp-bar-container">
      <div id="xp-fill"></div>
    </div>
    <div class="stats-row">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span class="badge" id="level-text">Lv.1</span>
        <span class="badge" id="time-text">00:00</span>
        <span class="badge" id="kill-text">击杀: 0</span>
        <div id="skills-bar"></div>
      </div>
      <button id="sound-btn">🔊 音效: 开</button>
    </div>
  </div>

  <!-- 开始界面 -->
  <div id="start-screen" class="overlay">
    <h1>🧙‍♂️ 魔法师 vs 史莱姆军团</h1>
    <p class="subtitle">
      <b>WASD / 方向键</b>（或拖动屏幕虚拟摇杆）移动。<br>
      升级可解锁<b>🔥火焰法典</b>、<b>⚡雷暴法阵</b>、<b>❄️冰霜新星</b>等四大流派魔法！
    </p>
    <button class="primary-btn" id="start-btn">开始战斗</button>
  </div>

  <!-- 升级界面 -->
  <div id="levelup-screen" class="overlay hidden">
    <h1>✨ 魔力觉醒！选择一项强化</h1>
    <div class="cards-container" id="cards-box"></div>
  </div>

  <!-- 结束界面 -->
  <div id="gameover-screen" class="overlay hidden">
    <h1>💀 魔力耗尽</h1>
    <p class="subtitle" id="final-stats">存活时间: 00:00 | 击杀史莱姆: 0</p>
    <button class="primary-btn" id="restart-btn">再来一局</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const xpFill = document.getElementById('xp-fill');
    const levelText = document.getElementById('level-text');
    const timeText = document.getElementById('time-text');
    const killText = document.getElementById('kill-text');
    const skillsBar = document.getElementById('skills-bar');
    const soundBtn = document.getElementById('sound-btn');

    const startScreen = document.getElementById('start-screen');
    const levelupScreen = document.getElementById('levelup-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const cardsBox = document.getElementById('cards-box');
    const finalStats = document.getElementById('final-stats');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 合成音效系统
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'thunder') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.exponentialRampToValueAtTime(45, now + 0.18);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'frost') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(920, now);
        osc.frequency.exponentialRampToValueAtTime(320, now + 0.25);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'gem') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.07);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.08);
        osc.frequency.setValueAtTime(659, now + 0.16);
        osc.frequency.setValueAtTime(880, now + 0.24);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 音效: 开' : '🔇 音效: 关';
    });

    // 游戏状态
    let gameState = 'START';
    let lastTime = 0;
    let elapsedTime = 0;
    let kills = 0;
    let spawnTimer = 0;

    let player = {};
    let bullets = [];
    let enemies = [];
    let gems = [];
    let particles = [];
    let lightnings = []; // 闪电特效数组
    let frostWaves = []; // 冰霜新星扩散环

    // 输入控制
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let joystick = { active: false, startX: 0, startY: 0, currX: 0, currY: 0, dx: 0, dy: 0 };
    canvas.addEventListener('pointerdown', e => {
      if (gameState !== 'PLAYING') return;
      joystick.active = true;
      joystick.startX = e.clientX;
      joystick.startY = e.clientY;
      joystick.currX = e.clientX;
      joystick.currY = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!joystick.active) return;
      joystick.currX = e.clientX;
      joystick.currY = e.clientY;
      const distX = joystick.currX - joystick.startX;
      const distY = joystick.currY - joystick.startY;
      const dist = Math.hypot(distX, distY);
      const maxDist = 50;
      if (dist > 5) {
        joystick.dx = (distX / dist) * Math.min(dist / maxDist, 1);
        joystick.dy = (distY / dist) * Math.min(dist / maxDist, 1);
      } else {
        joystick.dx = 0;
        joystick.dy = 0;
      }
    });
    window.addEventListener('pointerup', () => {
      joystick.active = false;
      joystick.dx = 0;
      joystick.dy = 0;
    });

    // 动态生成升级卡牌池（支持新技能解锁 + 技能升级 + 基础属性）
    function getAvailableUpgrades() {
      const pool = [
        // 1. 奥术飞弹强化
        {
          isSkill: true,
          badge: `奥术飞弹 Lv.${player.skills.missile + 1}`,
          icon: '🔮',
          title: '多重奥术飞弹',
          desc: '每次发射的飞弹数量 +1，伤害 +15%',
          apply: () => {
            player.skills.missile++;
            player.projectileCount += 1;
            player.damage = Math.round(player.damage * 1.15);
          }
        },
        // 2. 火焰法典（环绕火球）
        {
          isSkill: true,
          badge: player.skills.fireOrb === 0 ? '✨ 解锁新魔法' : `火焰法典 Lv.${player.skills.fireOrb + 1}`,
          icon: '🔥',
          title: player.skills.fireOrb === 0 ? '火焰法典' : '火焰法典·强化',
          desc: player.skills.fireOrb === 0
            ? '召唤 2 颗火球环绕身体旋转，灼烧并击退靠近的敌人'
            : '环绕火球数量 +1，旋转速度与灼烧伤害提升',
          apply: () => {
            if (player.skills.fireOrb === 0) {
              player.skills.fireOrb = 1;
              player.fireOrbCount = 2;
            } else {
              player.skills.fireOrb++;
              player.fireOrbCount += 1;
              player.fireOrbSpeed += 0.45;
              player.fireOrbDamage = Math.round(player.fireOrbDamage * 1.25);
            }
          }
        },
        // 3. 雷暴法阵（随机天雷）
        {
          isSkill: true,
          badge: player.skills.thunder === 0 ? '✨ 解锁新魔法' : `雷暴法阵 Lv.${player.skills.thunder + 1}`,
          icon: '⚡',
          title: player.skills.thunder === 0 ? '雷暴法阵' : '雷暴法阵·强化',
          desc: player.skills.thunder === 0
            ? '每 2.4 秒召唤天雷轰击随机敌人，造成范围高额伤害'
            : '天雷劈落数量 +1，冷却缩短，雷电伤害提升',
          apply: () => {
            if (player.skills.thunder === 0) {
              player.skills.thunder = 1;
            } else {
              player.skills.thunder++;
              player.thunderCount += 1;
              player.thunderCooldown = Math.max(0.9, player.thunderCooldown * 0.85);
              player.thunderDamage = Math.round(player.thunderDamage * 1.25);
            }
          }
        },
        // 4. 冰霜新星（范围冻结）
        {
          isSkill: true,
          badge: player.skills.frost === 0 ? '✨ 解锁新魔法' : `冰霜新星 Lv.${player.skills.frost + 1}`,
          icon: '❄️',
          title: player.skills.frost === 0 ? '冰霜新星' : '冰霜新星·强化',
          desc: player.skills.frost === 0
            ? '每隔数秒释放寒冰冲击波，冻结周围敌人使其减速 60%'
            : '寒冰冲击波范围扩大 25%，冷却时间缩短',
          apply: () => {
            if (player.skills.frost === 0) {
              player.skills.frost = 1;
            } else {
              player.skills.frost++;
              player.frostRadius = Math.round(player.frostRadius * 1.25);
              player.frostCooldown = Math.max(1.8, player.frostCooldown * 0.85);
              player.frostDamage = Math.round(player.frostDamage * 1.3);
            }
          }
        },
        // 5. 通用强化
        {
          isSkill: false,
          badge: '通用强化',
          icon: '⚡',
          title: '急速施法',
          desc: '所有魔法的冷却时间减少 15%',
          apply: () => {
            player.fireCooldown *= 0.85;
            player.thunderCooldown *= 0.85;
            player.frostCooldown *= 0.85;
          }
        },
        {
          isSkill: false,
          badge: '通用强化',
          icon: '👟',
          title: '疾风步',
          desc: '移动速度 +15%，经验拾取范围 +30%',
          apply: () => {
            player.speed *= 1.15;
            player.pickupRadius *= 1.3;
          }
        },
        {
          isSkill: false,
          badge: '生存强化',
          icon: '❤️',
          title: '生命涌泉',
          desc: '最大生命 +30 并立即恢复 50% 生命值',
          apply: () => {
            player.maxHp += 30;
            player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
          }
        }
      ];
      return pool;
    }

    // 确保开始按钮百分之百能点开的保险函数
    function startGame() {
      // 首次点击时安全唤醒音频上下文，防止浏览器拦截卡死
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.log("音频初始化提示：", e);
      }

      initGame();
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      levelupScreen.classList.add('hidden');
      gameState = 'PLAYING';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }
    
    function initGame() {
      player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 16,
        speed: 215,
        hp: 100,
        maxHp: 100,
        level: 1,
        xp: 0,
        nextXp: 8,
        pickupRadius: 80,
        invulnTimer: 0,

        // 技能等级记录
        skills: {
          missile: 1,
          fireOrb: 0,
          thunder: 0,
          frost: 0
        },

        // 技能1：奥术飞弹
        fireCooldown: 0.62,
        fireTimer: 0,
        damage: 14,
        projectileCount: 1,
        projectileSpeed: 470,

        // 技能2：火焰法典（环绕火球）
        fireOrbCount:
