<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>魔法师 vs 史莱姆军团</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #12151f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 顶部状态栏 */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 12px 16px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }
    .xp-bar-container {
      width: 100%;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }
    #xp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      transition: width 0.15s ease-out;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }
    .badge {
      background: rgba(20, 25, 38, 0.75);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(4px);
    }
    #sound-btn {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(20, 25, 38, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 14px;
    }
    #sound-btn:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* 弹窗遮罩 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 13, 22, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      padding: 20px;
      text-align: center;
    }
    .hidden {
      display: none !important;
    }
    h1 {
      font-size: clamp(28px, 5vw, 44px);
      margin-bottom: 10px;
      background: linear-gradient(135deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      margin-bottom: 26px;
      max-width: 440px;
      line-height: 1.6;
      font-size: 15px;
    }
    .primary-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.55);
    }

    /* 升级三选一卡牌 */
    .cards-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 760px;
      margin-top: 16px;
    }
    .upgrade-card {
      background: linear-gradient(180deg, #1e2538 0%, #151a28 100%);
      border: 2px solid rgba(129, 140, 248, 0.35);
      border-radius: 16px;
      padding: 20px 16px;
      width: 210px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .upgrade-card:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
    }
    .card-icon {
      font-size: 36px;
    }
    .card-title {
      font-size: 17px;
      font-weight: bold;
      color: #f8fafc;
    }
    .card-desc {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <div class="xp-bar-container">
      <div id="xp-fill"></div>
    </div>
    <div class="stats-row">
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <span class="badge" id="level-text">Lv.1</span>
        <span class="badge" id="time-text">00:00</span>
        <span class="badge" id="kill-text">击杀: 0</span>
      </div>
      <button id="sound-btn">🔊 音效: 开</button>
    </div>
  </div>

  <!-- 开始界面 -->
  <div id="start-screen" class="overlay">
    <h1>🧙‍♂️ 魔法师 vs 史莱姆军团</h1>
    <p class="subtitle">
      使用 <b>WASD / 方向键</b>（或按住屏幕拖动虚拟摇杆）移动。<br>
      魔法师会自动发射奥术飞弹，收集绿色宝石升级强化！
    </p>
    <button class="primary-btn" id="start-btn">开始战斗</button>
  </div>

  <!-- 升级界面 -->
  <div id="levelup-screen" class="overlay hidden">
    <h1>✨ 魔力觉醒！选择一项强化</h1>
    <div class="cards-container" id="cards-box"></div>
  </div>

  <!-- 结束界面 -->
  <div id="gameover-screen" class="overlay hidden">
    <h1>💀 魔力耗尽</h1>
    <p class="subtitle" id="final-stats">存活时间: 00:00 | 击杀史莱姆: 0</p>
    <button class="primary-btn" id="restart-btn">再来一局</button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI 元素
    const xpFill = document.getElementById('xp-fill');
    const levelText = document.getElementById('level-text');
    const timeText = document.getElementById('time-text');
    const killText = document.getElementById('kill-text');
    const soundBtn = document.getElementById('sound-btn');

    const startScreen = document.getElementById('start-screen');
    const levelupScreen = document.getElementById('levelup-screen');
    const gameoverScreen = document.getElementById('gameover-screen');
    const cardsBox = document.getElementById('cards-box');
    const finalStats = document.getElementById('final-stats');

    // 自适应窗口大小
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 简易合成音效系统 (Web Audio API)
    let soundEnabled = true;
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(type) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'hit') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.06);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'gem') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.07);
        gain.gain.setValueAtTime(0.07, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.start(now);
        osc.stop(now + 0.07);
      } else if (type === 'levelup') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554, now + 0.08);
        osc.frequency.setValueAtTime(659, now + 0.16);
        osc.frequency.setValueAtTime(880, now + 0.24);
        gain.gain.setValueAtTime(0.14, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 音效: 开' : '🔇 音效: 关';
    });

    // 游戏状态
    let gameState = 'START'; // START, PLAYING, LEVELUP, GAMEOVER
    let lastTime = 0;
    let elapsedTime = 0;
    let kills = 0;
    let spawnTimer = 0;

    // 玩家数据
    let player = {};
    let bullets = [];
    let enemies = [];
    let gems = [];
    let particles = [];

    // 键盘与虚拟摇杆输入
    const keys = {};
    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let joystick = { active: false, startX: 0, startY: 0, currX: 0, currY: 0, dx: 0, dy: 0 };

    canvas.addEventListener('pointerdown', e => {
      if (gameState !== 'PLAYING') return;
      joystick.active = true;
      joystick.startX = e.clientX;
      joystick.startY = e.clientY;
      joystick.currX = e.clientX;
      joystick.currY = e.clientY;
    });
    window.addEventListener('pointermove', e => {
      if (!joystick.active) return;
      joystick.currX = e.clientX;
      joystick.currY = e.clientY;
      const distX = joystick.currX - joystick.startX;
      const distY = joystick.currY - joystick.startY;
      const dist = Math.hypot(distX, distY);
      const maxDist = 50;
      if (dist > 5) {
        joystick.dx = (distX / dist) * Math.min(dist / maxDist, 1);
        joystick.dy = (distY / dist) * Math.min(dist / maxDist, 1);
      } else {
        joystick.dx = 0;
        joystick.dy = 0;
      }
    });
    window.addEventListener('pointerup', () => {
      joystick.active = false;
      joystick.dx = 0;
      joystick.dy = 0;
    });

    // 升级选项池
    const upgradePool = [
      {
        icon: '🔮',
        title: '多重飞弹',
        desc: '每次额外发射 +1 颗奥术飞弹',
        apply: () => { player.projectileCount += 1; }
      },
      {
        icon: '⚡',
        title: '急速施法',
        desc: '攻击冷却时间减少 18%',
        apply: () => { player.fireCooldown *= 0.82; }
      },
      {
        icon: '🔥',
        title: '奥术增幅',
        desc: '飞弹伤害提升 +35%',
        apply: () => { player.damage = Math.round(player.damage * 1.35); }
      },
      {
        icon: '👟',
        title: '疾风步',
        desc: '移动速度提升 +15%',
        apply: () => { player.speed *= 1.15; }
      },
      {
        icon: '🧲',
        title: '魔力磁铁',
        desc: '经验宝石拾取范围扩大 45%',
        apply: () => { player.pickupRadius *= 1.45; }
      },
      {
        icon: '❤️',
        title: '生命涌泉',
        desc: '最大生命 +25 并恢复 50% 生命',
        apply: () => {
          player.maxHp += 25;
          player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
        }
      }
    ];

    function initGame() {
      player = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 16,
        speed: 210,
        hp: 100,
        maxHp: 100,
        level: 1,
        xp: 0,
        nextXp: 10,
        fireCooldown: 0.65,
        fireTimer: 0,
        damage: 14,
        projectileCount: 1,
        projectileSpeed: 460,
        pickupRadius: 75,
        invulnTimer: 0
      };
      bullets = [];
      enemies = [];
      gems = [];
      particles = [];
      elapsedTime = 0;
      kills = 0;
      spawnTimer = 0;
      updateHUD();
    }

    function startGame() {
      initGame();
      startScreen.classList.add('hidden');
      gameoverScreen.classList.add('hidden');
      levelupScreen.classList.add('hidden');
      gameState = 'PLAYING';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('restart-btn').addEventListener('click', startGame);

    function triggerLevelUp() {
      gameState = 'LEVELUP';
      playSound('levelup');
      cardsBox.innerHTML = '';

      // 随机抽取 3 张不重复的卡牌
      const shuffled = [...upgradePool].sort(() => Math.random() - 0.5).slice(0, 3);
      shuffled.forEach(item => {
        const card = document.createElement('div');
        card.className = 'upgrade-card';
        card.innerHTML = `
          <div class="card-icon">${item.icon}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.desc}</div>
        `;
        card.onclick = () => {
          item.apply();
          levelupScreen.classList.add('hidden');
          updateHUD();
          gameState = 'PLAYING';
          lastTime = performance.now();
          requestAnimationFrame(gameLoop);
        };
        cardsBox.appendChild(card);
      });

      levelupScreen.classList.remove('hidden');
    }

    function spawnEnemy() {
      // 在屏幕边缘外生成史莱姆
      const margin = 40;
      let x, y;
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
      else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
      else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + margin; }
      else { x = -margin; y = Math.random() * canvas.height; }

      // 随时间变强，偶尔刷出大史莱姆
      const difficulty = 1 + elapsedTime / 45;
      const isBig = Math.random() < Math.min(0.25, elapsedTime / 180);

      enemies.push({
        x,
        y,
        radius: isBig ? 22 : 13,
        speed: isBig ? 65 : (85 + Math.random() * 25),
        hp: Math.round((isBig ? 55 : 18) * difficulty),
        maxHp: Math.round((isBig ? 55 : 18) * difficulty),
        color: isBig ? '#f43f5e' : '#4ade80',
        xpValue: isBig ? 5 : 2,
        hitFlash: 0
      });
    }

    function spawnParticles(x, y, color, count = 6) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 50 + Math.random() * 120;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.35 + Math.random() * 0.2,
          maxLife: 0.55,
          color,
          size: 3 + Math.random() * 3
        });
      }
    }

    function update(dt) {
      elapsedTime += dt;

      // 1. 玩家移动
      let moveX = joystick.dx;
      let moveY = joystick.dy;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      const len = Math.hypot(moveX, moveY);
      if (len > 1) {
        moveX /= len;
        moveY /= len;
      }

      player.x += moveX * player.speed * dt;
      player.y += moveY * player.speed * dt;

      // 限制在屏幕内
      player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
      player.y = Math.max(player.radius + 45, Math.min(canvas.height - player.radius, player.y));

      if (player.invulnTimer > 0) player.invulnTimer -= dt;

      // 2. 自动瞄准并射击最近敌人
      player.fireTimer -= dt;
      if (player.fireTimer <= 0 && enemies.length > 0) {
        let nearest = null;
        let minDist = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < minDist) {
            minDist = d;
            nearest = e;
          }
        }
        if (nearest) {
          const baseAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          const spread = 0.16; // 多发子弹的扇形夹角
          for (let i = 0; i < player.projectileCount; i++) {
            const offset = (i - (player.projectileCount - 1) / 2) * spread;
            const angle = baseAngle + offset;
            bullets.push({
              x: player.x,
              y: player.y,
              vx: Math.cos(angle) * player.projectileSpeed,
              vy: Math.sin(angle) * player.projectileSpeed,
              radius: 6,
              damage: player.damage,
              life: 1.8
            });
          }
          playSound('shoot');
          player.fireTimer = player.fireCooldown;
        }
      }

      // 3. 更新子弹
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }

        // 子弹碰撞史莱姆
        for (let j = enemies.length - 1; j >= 0; j--) {
          const e = enemies[j];
          if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
            e.hp -= b.damage;
            e.hitFlash = 0.08;
            spawnParticles(b.x, b.y, '#60a5fa', 3);
            bullets.splice(i, 1);

            if (e.hp <= 0) {
              playSound('hit');
              spawnParticles(e.x, e.y, e.color, 8);
              gems.push({ x: e.x, y: e.y, value: e.xpValue });
              enemies.splice(j, 1);
              kills++;
            }
            break;
          }
        }
      }

      // 4. 生成与更新史莱姆
      spawnTimer -= dt;
      const spawnInterval = Math.max(0.18, 0.95 - elapsedTime * 0.008);
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = spawnInterval;
      }

      for (const e of enemies) {
        if (e.hitFlash > 0) e.hitFlash -= dt;
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed * dt;
        e.y += Math.sin(angle) * e.speed * dt;

        // 史莱姆接触玩家
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        if (dist < player.radius + e.radius) {
          if (player.invulnTimer <= 0) {
            player.hp -= 12;
            player.invulnTimer = 0.45;
            spawnParticles(player.x, player.y, '#ef4444', 6);
            if (player.hp <= 0) {
              gameState = 'GAMEOVER';
              finalStats.textContent = `存活时间: ${formatTime(elapsedTime)} | 击杀史莱姆: ${kills}`;
              gameoverScreen.classList.remove('hidden');
            }
          }
        }
      }

      // 5. 更新经验宝石（磁吸与拾取）
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(player.x - g.x, player.y - g.y);
        if (dist < player.pickupRadius) {
          const angle = Math.atan2(player.y - g.y, player.x - g.x);
          g.x += Math.cos(angle) * 340 * dt;
          g.y += Math.sin(angle) * 340 * dt;
        }
        if (dist < player.radius + 8) {
          player.xp += g.value;
          gems.splice(i, 1);
          playSound('gem');

          if (player.xp >= player.nextXp) {
            player.xp -= player.nextXp;
            player.level++;
            player.nextXp = Math.round(player.nextXp * 1.35 + 4);
            updateHUD();
            triggerLevelUp();
            return;
          }
        }
      }

      // 6. 更新粒子特效
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      updateHUD();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateHUD() {
      const pct = Math.min(100, (player.xp / player.nextXp) * 100);
      xpFill.style.width = `${pct}%`;
      levelText.textContent = `Lv.${player.level}`;
      timeText.textContent = formatTime(elapsedTime);
      killText.textContent = `击杀: ${kills}`;
    }

    function render() {
      // 背景与魔法阵网格
      ctx.fillStyle = '#12151f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 48;
      for (let x = 0; x < canvas.width; x += gridSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += gridSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // 绘制经验宝石
      for (const g of gems) {
        ctx.fillStyle = '#34d399';
        ctx.beginPath();
        ctx.moveTo(g.x, g.y - 6);
        ctx.lineTo(g.x + 5, g.y);
        ctx.lineTo(g.x, g.y + 6);
        ctx.lineTo(g.x - 5, g.y);
        ctx.closePath();
        ctx.fill();
      }

      // 绘制史莱姆
      for (const e of enemies) {
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, Math.PI, 0);
        ctx.quadraticCurveTo(e.x + e.radius, e.y + e.radius * 0.9, e.x, e.y + e.radius * 0.9);
        ctx.quadraticCurveTo(e.x - e.radius, e.y + e.radius * 0.9, e.x - e.radius, e.y);
        ctx.fill();

        // 史莱姆眼睛
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(e.x - e.radius * 0.32, e.y - 1, 2.5, 0, Math.PI * 2);
        ctx.arc(e.x + e.radius * 0.32, e.y - 1, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // 绘制奥术飞弹
      for (const b of bullets) {
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // 绘制粒子
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
      }
      ctx.globalAlpha = 1;

      // 绘制魔法师
      ctx.save();
      if (player.invulnTimer > 0 && Math.floor(player.invulnTimer * 20) % 2 === 0) {
        ctx.globalAlpha = 0.45;
      }
      // 身体
      ctx.fillStyle = '#6366f1';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();
      // 巫师帽
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.moveTo(player.x - 16, player.y - 8);
      ctx.lineTo(player.x + 16, player.y - 8);
      ctx.lineTo(player.x, player.y - 28);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 玩家脚下血条
      const hpWidth = 36;
      const hpPct = Math.max(0, player.hp / player.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(player.x - hpWidth / 2, player.y + player.radius + 8, hpWidth, 5);
      ctx.fillStyle = hpPct > 0.35 ? '#22c55e' : '#ef4444';
      ctx.fillRect(player.x - hpWidth / 2, player.y + player.radius + 8, hpWidth * hpPct, 5);

      // 虚拟摇杆指示器
      if (joystick.active) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(joystick.startX, joystick.startY, 45, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
        ctx.beginPath();
        ctx.arc(joystick.currX, joystick.currY, 18, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function gameLoop(timestamp) {
      if (gameState !== 'PLAYING') return;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      update(dt);
      render();

      if (gameState === 'PLAYING') {
        requestAnimationFrame(gameLoop);
      }
    }
  </script>
</body>
</html>
